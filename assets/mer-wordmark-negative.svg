<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" role="img" aria-label="mer">
  <defs>
    <filter id="threshold" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="5" intercept="-1"/>
        <feFuncG type="linear" slope="5" intercept="-1"/>
        <feFuncB type="linear" slope="5" intercept="-1"/>
      </feComponentTransfer>
    </filter>
    <mask id="wordmark" mask-type="luminance">
      <image href="mer-wordmark-negative.png" width="540" height="240" filter="url(#threshold)"/>
    </mask>
  </defs>
  <rect width="540" height="240" fill="#fff" mask="url(#wordmark)"/>
</svg>
